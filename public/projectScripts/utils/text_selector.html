<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informer Text Configurator | Antigravity Kit</title>
    <meta name="description" content="Configuration tool for 3D UI informer text. Customize interactive labels and prompts for the Three.js portfolio.">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Informer Configurator">
    <meta property="og:description" content="Tool for customizing portfolio UI text.">
    
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --c-cyan: #00f2ff;
            --c-gold: #ffcc00;
            --c-crimson: #ff1a4d;
            --bg: #050505;
            --surface: #111;
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --glow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .hud-frame {
            max-width: 900px;
            width: 100%;
            border: var(--border);
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.8) 0%, rgba(10, 10, 10, 0.9) 100%);
            padding: 40px;
            box-shadow: var(--glow);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .hud-frame::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 20px;
            height: 20px;
            border-top: 2px solid var(--c-cyan);
            border-left: 2px solid var(--c-cyan);
        }

        .hud-frame::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            border-bottom: 2px solid var(--c-cyan);
            border-right: 2px solid var(--c-cyan);
        }

        header {
            border-bottom: var(--border);
            margin-bottom: 30px;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--c-cyan);
        }

        .status-pill {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--c-cyan);
            color: var(--c-cyan);
            padding: 4px 12px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--c-gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 204, 0, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .item:hover {
            background: rgba(0, 242, 255, 0.05);
            border-color: rgba(0, 242, 255, 0.3);
        }

        .item.active {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--c-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            transition: all 0.2s ease;
        }

        .item.active .checkbox {
            border-color: var(--c-cyan);
            background: var(--c-cyan);
        }

        .item.active .checkbox::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 12px;
            font-weight: bold;
        }

        .label {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .suggested {
            color: var(--c-gold);
            font-size: 10px;
            margin-left: auto;
            opacity: 0.6;
            font-family: 'JetBrains Mono', monospace;
        }

        footer {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .output-panel {
            background: #000;
            border: var(--border);
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #aaa;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            background: var(--c-cyan);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }

        button:hover {
            box-shadow: 0 0 20px var(--c-cyan);
            transform: translateY(-2px);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--c-gold);
            color: var(--c-gold);
        }

        button.secondary:hover {
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
            background: rgba(255, 204, 0, 0.05);
        }

        .hint {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="hud-frame">
        <header>
            <h1>Informer Configurator</h1>
            <div class="status-pill">SYSTEM_ACTIVE // VERB_DRIVEN</div>
        </header>

        <div id="container"></div>

        <footer>
            <div class="btn-group">
                <button onclick="generateConfig()">Generate Configuration</button>
                <button class="secondary" onclick="copyToClipboard()">Copy Result</button>
            </div>
            <div id="output" class="output-panel">Select items and click Generate...</div>
        </footer>
    </div>

    <div class="hint">Check the items you want to keep. Words marked with [S] are suggestions.</div>

    <script>
        const config = [
            {
                key: "UI_INFORMER_CHAIR",
                title: "Chair (Impulse)",
                items: ["PUSH CHAIR", "ADJUST SEATING", "MANIPULATE GEOMETRY", "CLEAR LANE"]
            },
            {
                key: "UI_INFORMER_BLACKHOLE",
                title: "Blackhole (Gravity)",
                items: ["GRAVITY WELL ACTIVE", "INITIATE COLLAPSE", "ACTIVATE GRAVITY [S]", "START COLLAPSE [S]", "TRIGGER VORTEX [S]"]
            },
            {
                key: "UI_INFORMER_SKY",
                title: "Sky (Lightning)",
                items: ["CALL LIGHTNING", "COMMAND ATMOSPHERE", "STRIKE LIGHTNING [S]", "SUMMON BOLT [S]", "CHARGE ATMOSPHERE [S]"]
            },
            {
                key: "UI_INFORMER_DOOR",
                title: "Glass Door (Slide)",
                items: ["ADJUST ROOM LIGHTING", "SHIFT VIBE", "SLIDE DOOR [S]", "OPEN PASSAGE [S]", "TOGGLE GLASS [S]"]
            },
            {
                key: "UI_INFORMER_LAMP",
                title: "Lamp (Light)",
                items: ["TOGGLE LAMP", "ADJUST PHOTONS", "SWITCH LIGHT [S]", "TOGGLE LAMP [S]", "ADJUST GLOW [S]"]
            },
            {
                key: "UI_INFORMER_SCREEN",
                title: "Computer (Roles)",
                items: ["REMAP MAX & MIN ROLES", "SHIFT CAT HIERARCHY", "REMAP ROLES [S]", "REASSIGN PERSONNEL [S]", "REDEPLOY TEAM [S]"]
            },
            {
                key: "UI_INFORMER_MJOLNIR",
                title: "Mjolnir (Reset)",
                items: ["WIELD THE HAMMER", "WORTHY DETECTED", "WIELD HAMMER [S]", "STRIKE MJOLNIR [S]", "RESET REALM [S]"]
            },
            {
                key: "UI_INFORMER_BULB",
                title: "Fan Bulb (Ritual)",
                items: ["TOGGLE BULB", "CONTROL GLOW", "TRIGGER RITUAL [S]", "IGNITE CORE [S]", "COLLAPSE DATA [S]"]
            },
            {
                key: "UI_INFORMER_REBOOT",
                title: "Case Cover (Reboot)",
                items: ["REBOOT SYSTEM", "FORCED RESTART", "CLEAR CACHE", "KICKSTART CORE"]
            },
            {
                key: "UI_INFORMER_SCREEN_CODE",
                title: "Screen: Coding",
                items: ["RECODE SYSTEM?", "RESUME TYPING?", "RESUME CODING [S]", "ACCESS SOURCE [S]", "EDIT LOGIC [S]"]
            },
            {
                key: "UI_INFORMER_SCREEN_NETFLIX",
                title: "Screen: Netflix",
                items: ["WATCH NETFLIX?", "CONTINUE SHOW?", "WATCH NETFLIX [S]", "STREAM SHOW [S]", "START CHILLING [S]"]
            },
            {
                key: "UI_INFORMER_SCREEN_DOTA",
                title: "Screen: Dota",
                items: ["DOTA?", "DEFEND ANCIENT?", "LAUNCH DOTA [S]", "DEFEND ANCIENT [S]", "QUEUE MATCH [S]"]
            },
            {
                key: "UI_INFORMER_SCREEN_DOTA_ACCEPT",
                title: "Screen: Dota Accept",
                items: ["ACCEPT MATCH?", "BATTLE BEGINS", "ACCEPT MATCH [S]", "JOIN BATTLE [S]", "ENTER ARENA [S]"]
            },
            {
                key: "UI_INFORMER_SCREEN_LAYOUT_SPLIT",
                title: "Screen: Split Layout",
                items: ["SPLIT LAYOUT?", "ENABLE MOBILE VIEW?", "SPLIT VIEW [S]", "ENABLE MOBILE [S]", "SHIFT LAYOUT [S]"]
            },
            {
                key: "UI_INFORMER_SCREEN_LAYOUT_FULL",
                title: "Screen: Full Layout",
                items: ["FULLSCREEN CODE?", "FOCUS MODE?", "MAXIMIZE EDITOR [S]", "FOCUS CODE [S]", "TOGGLE FULLSCREEN [S]"]
            },
            {
                key: "UI_INFORMER_CHILL",
                title: "Screen: Chill Fallback",
                items: ["EXECUTE CHILL", "IDLE MODE", "ENGAGE CHILL [S]", "START IDLE [S]"]
            },
            {
                key: "UI_INFORMER_DEV_MODE",
                title: "Screen: Dev Fallback",
                items: ["ENGAGE DEV MODE", "DEBUG ENVIRONMENT", "ENABLE DEBUG [S]", "OPEN IDE [S]"]
            },
            {
                key: "UI_INFORMER_AUDIT_MODE",
                title: "Screen: Audit Fallback",
                items: ["ENGAGE AUDIT MODE", "PERFORM SECURITY SCAN", "RUN AUDIT [S]", "SCAN SECURITY [S]"]
            },
            {
                key: "UI_INFORMER_CAT_MAX",
                title: "Max (Lead Cat)",
                items: ["MAX - TECH LEAD", "MAX - DEVOPS OVERSEER", "CATCH MAX [S]", "CAPTURE LEAD [S]", "ENGAGE ARCHITECT [S]"]
            },
            {
                key: "UI_INFORMER_CAT_MIN",
                title: "Min (Junior Cat)",
                items: ["MIN - QA ENGINEER", "MIN - FRONTEND SCOUT", "CATCH MIN [S]", "CAPTURE QA [S]", "ENGAGE SCOUT [S]"]
            }
        ];

        const container = document.getElementById('container');

        config.forEach((cat, catIdx) => {
            const catEl = document.createElement('div');
            catEl.className = 'category';
            catEl.innerHTML = `<div class="category-title">${cat.title}</div><div class="grid" id="grid-${catIdx}"></div>`;
            container.appendChild(catEl);

            const grid = document.getElementById(`grid-${catIdx}`);
            cat.items.forEach(text => {
                const item = document.createElement('div');
                item.className = 'item';
                const isSuggested = text.includes('[S]');
                const cleanText = text.replace(' [S]', '');

                item.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="label">${cleanText}</div>
                    ${isSuggested ? '<div class="suggested">SUGGESTED</div>' : ''}
                `;

                item.onclick = () => {
                    item.classList.toggle('active');
                    updateOutput();
                };

                item.dataset.key = cat.key;
                item.dataset.val = cleanText;
                grid.appendChild(item);
            });
        });

        function updateOutput() {
            const results = {};
            document.querySelectorAll('.item.active').forEach(el => {
                const key = el.dataset.key;
                const val = el.dataset.val;
                if (!results[key]) results[key] = [];
                results[key].push(val);
            });

            const outputEl = document.getElementById('output');
            if (Object.keys(results).length === 0) {
                outputEl.textContent = "Select items and click Generate...";
                return;
            }
            outputEl.textContent = JSON.stringify(results, null, 2);
        }

        function generateConfig() {
            updateOutput();
        }

        function copyToClipboard() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert("Configuration copied to clipboard! Paste it into the chat.");
            });
        }
    </script>
</body>

</html>
